services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  webhook-service:
    build:
      context: .
      dockerfile: webhook-service/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3000
      RABBITMQ_HOST: amqp://rabbitmq:5672
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      APP_ENABLED: ${APP_ENABLED:-true}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      ALLOW_INSECURE_WEBHOOK_SECRET: ${ALLOW_INSECURE_WEBHOOK_SECRET:-false}
      WEBHOOK_RATE_LIMIT_IP_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_IP_PER_MINUTE:-300}
      WEBHOOK_RATE_LIMIT_USER_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_USER_PER_MINUTE:-20}
      WEBHOOK_IDEMPOTENCY_TTL_SECONDS: ${WEBHOOK_IDEMPOTENCY_TTL_SECONDS:-300}
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - '3000:3000'

  orchestrator-service:
    build:
      context: .
      dockerfile: orchestrator-service/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3001
      RABBITMQ_HOST: amqp://rabbitmq:5672
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-900}
      BOOKING_LOCK_SECONDS: ${BOOKING_LOCK_SECONDS:-180}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_HTTP_REFERER: ${OPENAI_HTTP_REFERER:-}
      OPENAI_X_TITLE: ${OPENAI_X_TITLE:-barberbot-js}
      LLM_MIN_CONFIDENCE: ${LLM_MIN_CONFIDENCE:-0.65}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ACTION_TOKEN_SECRET: ${TELEGRAM_ACTION_TOKEN_SECRET:-}
      ACTION_TOKEN_TTL_SECONDS: ${ACTION_TOKEN_TTL_SECONDS:-600}
      ALLOW_INSECURE_ACTION_TOKENS: ${ALLOW_INSECURE_ACTION_TOKENS:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '3001:3001'

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3002
      RABBITMQ_HOST: amqp://rabbitmq:5672
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_BOOKINGS_TABLE: ${SUPABASE_BOOKINGS_TABLE:-bookings}
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - '3002:3002'
